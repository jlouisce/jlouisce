<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Jonnathan Luis, designer turned full stack developer</title>
  <desc id="d">A design canvas with the name Jonnathan Luis selected like a Figma layer, a code window describing his stack, and two multiplayer cursors.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#232838"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A259FF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#0D99FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0ACF83" stop-opacity=".18"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="56" y="232" width="0" height="40">
        <animate attributeName="width" from="0" to="620" begin="0.6s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .mono { white-space: pre; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .line { animation: rise .5s ease-out both; }
    .l1 { animation-delay: 1.0s; } .l2 { animation-delay: 1.3s; } .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 1.9s; } .l5 { animation-delay: 2.2s; } .l6 { animation-delay: 2.5s; }
    .caret { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 1094px 37px; }
    .cur-a { animation: pathA 9s ease-in-out infinite; }
    .cur-b { animation: pathB 7s ease-in-out infinite; }
    .handles { animation: pop .4s ease-out .2s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pathA {
      0%   { transform: translate(470px, 330px); }
      30%  { transform: translate(612px, 196px); }
      48%  { transform: translate(612px, 196px); }
      72%  { transform: translate(250px, 300px); }
      100% { transform: translate(470px, 330px); }
    }
    @keyframes pathB {
      0%   { transform: translate(1110px, 338px); }
      40%  { transform: translate(1008px, 236px); }
      60%  { transform: translate(1008px, 236px); }
      100% { transform: translate(1110px, 338px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line, .caret, .pulse, .cur-a, .cur-b, .handles { animation: none !important; }
      .cur-a { transform: translate(612px, 196px); }
      .cur-b { transform: translate(1008px, 236px); }
    }
  </style>

  <g clip-path="url(#card)">
    <!-- canvas -->
    <rect width="1200" height="400" fill="#0E1015"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- top bar -->
    <g class="mono" font-size="14" fill="#8B93A7">
      <rect x="40" y="30" width="14" height="14" rx="3" fill="none" stroke="#8B93A7" stroke-width="1.5"/>
      <text x="64" y="42">Frame 01 / hello-world</text>
      <circle class="pulse" cx="1094" cy="37" r="5" fill="#0ACF83"/>
      <text x="1106" y="42" font-size="13">building</text>
    </g>

    <!-- selected headline layer -->
    <text class="sans" x="60" y="176" font-size="72" font-weight="800" fill="#F5F5F7" textLength="540" lengthAdjust="spacingAndGlyphs">Jonnathan Luis</text>
    <g class="handles">
      <rect x="48" y="106" width="564" height="90" fill="none" stroke="#0D99FF" stroke-width="1.5"/>
      <g fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.5">
        <rect x="44" y="102" width="8" height="8"/>
        <rect x="608" y="102" width="8" height="8"/>
        <rect x="44" y="192" width="8" height="8"/>
        <rect x="608" y="192" width="8" height="8"/>
      </g>
      <rect x="283" y="206" width="94" height="22" rx="5" fill="#0D99FF"/>
      <text class="mono" x="330" y="221" font-size="12" fill="#FFFFFF" text-anchor="middle">564 × 90</text>
      <text class="mono" x="48" y="96" font-size="12" fill="#0D99FF">T  name.heading</text>
    </g>

    <!-- typed subtitle -->
    <g clip-path="url(#type)">
      <text class="sans" x="60" y="262" font-size="26" fill="#C9CED8">Designer turned full stack developer.</text>
    </g>
    <text class="mono" x="60" y="304" font-size="17" fill="#6B7385">// from the Figma frame to the database row</text>

    <!-- code window -->
    <g transform="translate(712 88)">
      <rect width="446" height="232" rx="12" fill="#151821" stroke="#262B38"/>
      <circle cx="22" cy="22" r="6" fill="#F24E1E"/>
      <circle cx="42" cy="22" r="6" fill="#FFC700"/>
      <circle cx="62" cy="22" r="6" fill="#0ACF83"/>
      <text class="mono" x="424" y="27" font-size="12" fill="#6B7385" text-anchor="end">about.ts</text>
      <line x1="0" y1="44" x2="446" y2="44" stroke="#262B38"/>
      <g class="mono" font-size="15" xml:space="preserve">
        <g class="line l1"><text x="18" y="76" fill="#4A5163">1</text><text x="46" y="76"><tspan fill="#A259FF">const</tspan><tspan fill="#F5F5F7"> luis = {</tspan></text></g>
        <g class="line l2"><text x="18" y="102" fill="#4A5163">2</text><text x="46" y="102" fill="#F5F5F7">  craft: [<tspan fill="#0ACF83">"UI/UX"</tspan>, <tspan fill="#0ACF83">"Full Stack"</tspan>],</text></g>
        <g class="line l3"><text x="18" y="128" fill="#4A5163">3</text><text x="46" y="128" fill="#F5F5F7">  speaks: <tspan fill="#0ACF83">"TypeScript"</tspan>,</text></g>
        <g class="line l4"><text x="18" y="154" fill="#4A5163">4</text><text x="46" y="154" fill="#F5F5F7">  studio: <tspan fill="#0ACF83">"OGX"</tspan>,</text></g>
        <g class="line l5"><text x="18" y="180" fill="#4A5163">5</text><text x="46" y="180" fill="#F5F5F7">  base: <tspan fill="#0ACF83">"Colombia"</tspan>,</text></g>
        <g class="line l6"><text x="18" y="206" fill="#4A5163">6</text><text x="46" y="206" fill="#F5F5F7">};</text><rect class="caret" x="70" y="192" width="9" height="18" fill="#0D99FF"/></g>
      </g>
    </g>

    <!-- bottom strip -->
    <text class="mono" x="60" y="368" font-size="14" fill="#6B7385">UI/UX  ·  Full Stack  ·  Design Systems  ·  SaaS</text>
    <text class="mono" x="1158" y="368" font-size="14" fill="#6B7385" text-anchor="end">@jlouisce</text>

    <!-- multiplayer cursors -->
    <g class="cur-a" transform="translate(612 196)">
      <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#A259FF" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="16" y="22" width="76" height="24" rx="6" fill="#A259FF"/>
      <text class="sans" x="54" y="39" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">designer</text>
    </g>
    <g class="cur-b" transform="translate(1008 236)">
      <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#0ACF83" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="16" y="22" width="48" height="24" rx="6" fill="#0ACF83"/>
      <text class="sans" x="40" y="39" font-size="13" font-weight="600" fill="#0E1015" text-anchor="middle">dev</text>
    </g>
  </g>
</svg>
